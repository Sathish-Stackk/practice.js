<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables</title>
</head>
<body>
    <script>
        let variable1 = 5;
        console.log(variable1);
        console.log(variable1 + 55);
        console.log(variable1 %4);
        console.log(variable1*534);


        let result =44;
        console.log(result-3*5);

        let message = "hate you"
        console.log(message);   // if we use let key word , we can modify or re assign later !//

        variable1=10;
        console.log(variable1);//re assigned value here//

        const Variable2 = 53;
        console.log(Variable2);
        Variable2=45;    //   we can't modify / reassign the value , once it created with const key word (constant always)//

    </script>
    
</body>
</html>
